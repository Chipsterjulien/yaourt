# Configuration de yaourt — copier vers ~/.config/yaourt/config.toml
# Toutes les clés sont optionnelles. Décommenter uniquement celles à modifier.

# Répertoire de clonage/build des paquets AUR.
# builddir = "~/.cache/yaourt"

# Commande sudo pour les opérations pacman nécessitant root.
# sudo = "sudo"

# Éditeur pour la revue de PKGBUILD.
# Par défaut : $EDITOR, sinon $VISUAL, sinon "vi".
# editor = "vim"

# Couleur dans les affichages de yaourt.
# color = true

# Langue de l'interface. "auto" suit LANGUAGE, LC_ALL, LC_MESSAGES, puis LANG.
# Toute locale disposant d'un catalogue est acceptée (par exemple "fr",
# "pt_BR" ou "zh_TW"). Une locale régionale se replie sur sa langue de base,
# puis sur l'anglais.
# language = "auto"

# Base de l'AUR (RPC v5 + git).
# aur_url = "https://aur.archlinux.org"

# Récapitulatif AUR affiché avant les mises à jour :
#   "notable" = paquets orphelins, périmés ou non gérés par l'AUR (défaut) ;
#   "all"     = tous les paquets AUR installés avec leur statut ;
#   false     = aucun récapitulatif.
# La valeur true reste acceptée comme alias de "all".
# list_aur = "notable"

# Contrôler pendant les mises à jour unifiées les paquets de développement
# dont la version peut changer sans nouvelle version AUR (-git, -hg, -svn et
# -bzr). Cela ajoute une requête .SRCINFO et des contrôles de références VCS
# par PackageBase candidat. Activation ponctuelle : yaourt -Syu --devel
# devel = false

# Supprimer les dépendances de build installées pendant l'opération AUR et
# devenues orphelines à sa fin. Les paquets déjà installés avant le build ne
# sont jamais sélectionnés. Valeurs : false (défaut), "ask" ou "always".
# Avec "ask", la réponse par défaut est non ; --noconfirm les conserve.
# cleanup_build_deps = "ask"

# Nombre maximal de résultats affichés par section lors d'une recherche (-Ss).
# AUR et dépôts sont limités chacun à cette valeur (pour l'AUR, ce sont les
# paquets les mieux notés qui sont conservés). 0 = aucune limite (tout afficher).
# search_limit = 20
