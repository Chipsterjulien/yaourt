# yaourt configuration — copy to ~/.config/yaourt/config.toml
# Every key is optional. Uncomment only the values you want to change.

# Directory used to clone and build AUR packages.
# builddir = "~/.cache/yaourt"

# sudo command used for pacman operations that require root privileges.
# sudo = "sudo"

# Editor used to review PKGBUILD files and other tracked build files.
# Default: $EDITOR, then $VISUAL, then "vi".
# editor = "vim"

# Enable colors in yaourt output.
# color = true

# AUR base URL (RPC v5 and Git).
# aur_url = "https://aur.archlinux.org"

# AUR summary displayed before upgrades:
#   "notable" = orphaned, out-of-date, or non-AUR-managed packages (default);
#   "all"     = every installed AUR package and its status;
#   false     = no AUR summary.
# The legacy value true remains accepted as an alias for "all".
# list_aur = "notable"

# Maximum number of results displayed in each search section (-Ss).
# AUR and repository results are each limited to this value. For the AUR, the
# highest-rated packages are retained. 0 means unlimited (display everything).
# search_limit = 20
